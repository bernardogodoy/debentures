name: Atualizar taxas ANBIMA

on:
  schedule:
    # ANBIMA publica as taxas até 20h (Brasília). 23:37 UTC = 20:37 BRT, seg–sex.
    - cron: "37 23 * * 1-5"
    # Repescagem na manhã seguinte (07:17 BRT), caso o arquivo tenha atrasado.
    - cron: "17 10 * * 2-6"
  # Emissor novo em emissores.json: roda na hora, com janela que cobre os ~20 dias úteis da ANBIMA
  push:
    branches: [main]
    paths: [emissores.json]
  workflow_dispatch:
    inputs:
      dias:
        description: "Dias úteis para buscar (backfill)"
        default: "8"
      snd_completo:
        description: "Rebaixar o histórico completo de negócios do SND"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # execuções enfileiradas partem da versão mais recente, não do commit que as disparou
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e processar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.snd_completo }}" = "true" ]; then EXTRA="--snd-completo"; fi
          DIAS="${{ github.event.inputs.dias || '8' }}"
          if [ "${{ github.event_name }}" = "push" ]; then DIAS=25; fi
          echo "ARGS=--dias $DIAS $EXTRA" >> "$GITHUB_ENV"
          python scripts/update.py --dias "$DIAS" $EXTRA
          python scripts/mercado.py || echo "Aba Juros e crédito: falha na coleta (dados anteriores mantidos)"
      - name: Salvar dados
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
            git commit -q -m "Taxas ANBIMA $(date -u +%Y-%m-%d)"
            if git push; then exit 0; fi
            # outra execução salvou antes: parte da versão nova e refaz o processamento por cima dela
            echo "Push recusado; refazendo sobre a versão mais recente (tentativa $tentativa)"
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/update.py $ARGS
            python scripts/mercado.py || true
          done
          exit 1
